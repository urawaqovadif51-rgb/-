name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: magic-classroom-ai/apps/web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('magic-classroom-ai')
          for path in root.rglob('*.json'):
              with path.open(encoding='utf-8') as f:
                  json.load(f)
              print('OK', path)
          PY

      - name: Validate OpenAPI YAML syntax
        run: |
          pip install pyyaml
          python - <<'PY'
          import yaml
          with open('magic-classroom-ai/openapi/openapi.yaml', encoding='utf-8') as f:
              doc = yaml.safe_load(f)
          assert doc.get('openapi'), 'missing openapi version'
          assert doc.get('paths') is not None, 'missing paths'
          print('OpenAPI YAML syntax OK')
          PY

      - name: Install web dependencies
        working-directory: magic-classroom-ai/apps/web
        run: npm ci

      - name: Web lint
        working-directory: magic-classroom-ai/apps/web
        run: npm run lint

      - name: Web typecheck
        working-directory: magic-classroom-ai/apps/web
        run: npm run typecheck

      - name: Web test
        working-directory: magic-classroom-ai/apps/web
        run: npm test -- --run

      - name: Web build
        working-directory: magic-classroom-ai/apps/web
        run: npm run build

      - name: Install API dependencies
        working-directory: magic-classroom-ai/apps/api
        run: pip install -r requirements-dev.txt

      - name: API tests
        working-directory: magic-classroom-ai/apps/api
        run: pytest -q
