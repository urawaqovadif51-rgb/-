openapi: 3.1.0
info:
  title: Magic Classroom AI API
  version: 0.1.0
  description: Contract draft for Magic Classroom AI MVP.
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: [string, 'null'] }
    User:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: [string, 'null'], format: email }
        role:
          type: string
          enum: [student, teacher, school_admin, platform_admin]
        tenant_id: { type: [string, 'null'], format: uuid }
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string }
        password: { type: string, minLength: 8 }
    LoginResponse:
      type: object
      required: [access_token, refresh_token, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        user: { $ref: '#/components/schemas/User' }
    Course:
      type: object
      required: [id, title, slug, status]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        slug: { type: string }
        status:
          type: string
          enum: [draft, published, archived]
        theme: { type: [string, 'null'] }
        updated_at: { type: string, format: date-time }
    CourseCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        subtitle: { type: [string, 'null'], maxLength: 240 }
        theme: { type: [string, 'null'] }
    Scene:
      type: object
      required: [id, course_id, type, order, config]
      properties:
        id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        type: { type: string }
        order: { type: integer, minimum: 1 }
        config: { type: object, additionalProperties: true }
    GenerationJob:
      type: object
      required: [id, status, course_id]
      properties:
        id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        status:
          type: string
          enum: [queued, parsing, planning, generating, validating, completed, failed, cancelled]
        progress: { type: integer, minimum: 0, maximum: 100 }
        error_message: { type: [string, 'null'] }
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      security: []
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /me:
    get:
      summary: Current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /courses:
    get:
      summary: List courses
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, page, page_size]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Course' }
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
    post:
      summary: Create course
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
  /courses/{course_id}:
    parameters:
      - in: path
        name: course_id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Course detail
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    patch:
      summary: Update course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string }
                subtitle: { type: [string, 'null'] }
                theme: { type: [string, 'null'] }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
  /courses/{course_id}/scenes:
    parameters:
      - in: path
        name: course_id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: List scenes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Scene' }
    post:
      summary: Create scene
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, order, config]
              properties:
                type: { type: string }
                order: { type: integer, minimum: 1 }
                config: { type: object, additionalProperties: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scene' }
  /generation/jobs:
    post:
      summary: Create AI generation job
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [course_id, mode]
              properties:
                course_id: { type: string, format: uuid }
                source_asset_ids:
                  type: array
                  items: { type: string, format: uuid }
                mode: { type: string, enum: [course-draft] }
                preferences: { type: object, additionalProperties: true }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationJob' }
  /generation/jobs/{job_id}:
    get:
      summary: Generation job status
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationJob' }
  /public/courses/{slug}:
    get:
      security: []
      summary: Public published course config
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
